<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>後期中間150｜英単語スプリント</title>
    <link rel="stylesheet" href="styles.css?v=20260730-1" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Midterm Exam · 150 Cards</p>
          <h1>後期中間150</h1>
          <p class="subtitle">見て、思い出して、3秒で仕分け。</p>
        </div>
        <div class="summary" aria-label="学習状況">
          <div>
            <span id="answerCount">0</span>
            <small>学習回数</small>
          </div>
          <div>
            <span id="accuracyRate">0%</span>
            <small>正答率</small>
          </div>
          <div>
            <span id="missedCount">0</span>
            <small>要復習</small>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="出題設定">
        <div class="control-group control-group-primary">
          <span class="control-label">学習</span>
          <div class="segmented segmented-two" role="tablist" aria-label="学習方法">
            <button class="segment is-active" type="button" data-study-mode="flash">
              暗記カード
            </button>
            <button class="segment" type="button" data-study-mode="quiz">4択テスト</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">出題</span>
          <div class="segmented" role="tablist" aria-label="出題方向">
            <button class="segment is-active" type="button" data-mode="mixed">混合</button>
            <button class="segment" type="button" data-mode="en-ja">英語→日本語</button>
            <button class="segment" type="button" data-mode="ja-en">日本語→英語</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">範囲</span>
          <select id="testFilter" class="control-select" aria-label="テスト範囲" disabled>
            <option value="all">すべて</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">復習</span>
          <div class="segmented" role="tablist" aria-label="復習方法">
            <button class="segment is-active" type="button" data-queue="all">全範囲</button>
            <button class="segment" type="button" data-queue="missed">要復習</button>
            <button class="segment" type="button" data-queue="weak">苦手優先</button>
          </div>
        </div>
      </section>

      <section class="workspace">
        <article class="quiz-panel" aria-live="polite">
          <div id="emptyState" class="empty-state" hidden>
            <h2 id="emptyTitle">問題がありません</h2>
            <p id="emptyMessage"></p>
            <button id="restartCycleButton" class="primary-button" type="button" hidden>
              もう一周する
            </button>
          </div>

          <div id="quizView">
            <div class="cycle-progress" aria-label="現在の一周の進捗">
              <div class="cycle-progress-copy">
                <span>この一周</span>
                <strong id="cycleProgressText">0 / 150</strong>
              </div>
              <div
                class="progress-track"
                role="progressbar"
                aria-label="一周の進捗"
                aria-valuemin="0"
                aria-valuemax="150"
                aria-valuenow="0"
              >
                <span id="cycleProgressBar"></span>
              </div>
            </div>

            <div class="question-meta">
              <span id="directionLabel" class="badge">混合</span>
              <span id="tagLabel" class="muted"></span>
            </div>

            <div class="question">
              <p id="promptLabel" class="prompt-label">Question</p>
              <h2 id="promptText"></h2>
              <p id="exampleText" class="example"></p>
            </div>

            <div id="options" class="options" aria-label="選択肢"></div>

            <div id="result" class="result" hidden>
              <div>
                <p id="resultLabel" class="result-label"></p>
                <p id="answerText" class="answer-text"></p>
              </div>
              <p id="detailText" class="detail-text"></p>
            </div>

            <div id="flashAnswer" class="flash-answer" hidden>
              <p class="flash-answer-label">ANSWER</p>
              <p id="flashAnswerText" class="flash-answer-text"></p>
              <p id="flashDetailText" class="flash-detail-text"></p>
            </div>

            <div id="flashActions" class="flash-actions" hidden>
              <button id="revealButton" class="reveal-button" type="button">
                答えを見る <kbd>Space</kbd>
              </button>
              <div id="ratingButtons" class="rating-buttons" hidden>
                <button class="rating-button rating-again" type="button" data-rating="again">
                  <span>もう一度</span><small>すぐ復習 · 1</small>
                </button>
                <button class="rating-button rating-hard" type="button" data-rating="hard">
                  <span>迷った</span><small>あとで復習 · 2</small>
                </button>
                <button class="rating-button rating-good" type="button" data-rating="good">
                  <span>覚えた</span><small>次へ · 3</small>
                </button>
              </div>
            </div>

            <div id="quizActions" class="actions">
              <button id="nextButton" class="primary-button" type="button" disabled>次の問題</button>
            </div>
          </div>
        </article>

        <aside class="side-panel">
          <section class="panel-section">
            <div class="section-title">
              <h2>要復習</h2>
              <span id="missedListCount" class="count">0</span>
            </div>
            <ul id="missedList" class="missed-list"></ul>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>データ</h2>
              <span id="itemCount" class="count">0</span>
            </div>
            <p id="dataStatus" class="data-status">読み込み中</p>
            <button id="resetButton" class="danger-button" type="button">履歴リセット</button>
          </section>
        </aside>
      </section>
    </main>

    <script src="app.js?v=20260730-1"></script>
  </body>
</html>
