<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英単語テスト</title>
    <link rel="stylesheet" href="styles.css?v=20260603-2" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Vocabulary Trainer</p>
          <h1>英単語テスト</h1>
        </div>
        <div class="summary" aria-label="学習状況">
          <div>
            <span id="studiedCount">0</span>
            <small>学習済み</small>
          </div>
          <div>
            <span id="accuracyRate">0%</span>
            <small>正答率</small>
          </div>
          <div>
            <span id="missedCount">0</span>
            <small>前回ミス</small>
          </div>
        </div>
      </header>

      <section class="controls" aria-label="出題設定">
        <div class="control-group">
          <span class="control-label">出題</span>
          <div class="segmented" role="tablist" aria-label="出題方向">
            <button class="segment is-active" type="button" data-mode="mixed">混合</button>
            <button class="segment" type="button" data-mode="en-ja">英語→日本語</button>
            <button class="segment" type="button" data-mode="ja-en">日本語→英語</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">範囲</span>
          <select id="testFilter" class="control-select" aria-label="テスト範囲" disabled>
            <option value="all">すべて</option>
          </select>
        </div>

        <div class="control-group">
          <span class="control-label">復習</span>
          <div class="segmented" role="tablist" aria-label="復習方法">
            <button class="segment is-active" type="button" data-queue="all">全範囲</button>
            <button class="segment" type="button" data-queue="missed">前回ミス</button>
            <button class="segment" type="button" data-queue="weak">苦手優先</button>
          </div>
        </div>
      </section>

      <section class="workspace">
        <article class="quiz-panel" aria-live="polite">
          <div id="emptyState" class="empty-state" hidden>
            <h2 id="emptyTitle">問題がありません</h2>
            <p id="emptyMessage"></p>
            <button id="restartCycleButton" class="primary-button" type="button" hidden>
              もう一周する
            </button>
          </div>

          <div id="quizView">
            <div class="question-meta">
              <span id="directionLabel" class="badge">混合</span>
              <span id="tagLabel" class="muted"></span>
            </div>

            <div class="question">
              <p id="promptLabel" class="prompt-label">Question</p>
              <h2 id="promptText"></h2>
              <p id="exampleText" class="example"></p>
            </div>

            <div id="options" class="options" aria-label="選択肢"></div>

            <div id="result" class="result" hidden>
              <div>
                <p id="resultLabel" class="result-label"></p>
                <p id="answerText" class="answer-text"></p>
              </div>
              <p id="detailText" class="detail-text"></p>
            </div>

            <div class="actions">
              <button id="nextButton" class="primary-button" type="button" disabled>次の問題</button>
              <button id="reshuffleButton" class="ghost-button" type="button">並び替え</button>
            </div>
          </div>
        </article>

        <aside class="side-panel">
          <section class="panel-section">
            <div class="section-title">
              <h2>前回ミス</h2>
              <span id="missedListCount" class="count">0</span>
            </div>
            <ul id="missedList" class="missed-list"></ul>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>データ</h2>
              <span id="itemCount" class="count">0</span>
            </div>
            <p id="dataStatus" class="data-status">読み込み中</p>
            <button id="resetButton" class="danger-button" type="button">履歴リセット</button>
          </section>
        </aside>
      </section>
    </main>

    <script src="app.js?v=20260603-4"></script>
  </body>
</html>
